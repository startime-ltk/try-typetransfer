plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flyingmouse.format'
    compileSdk 36

    defaultConfig {
        applicationId "com.flyingmouse.format"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.0.0"

        // 仅保留 64 位 ABI（arm64-v8a 真机 + x86_64 模拟器），裁剪 FFmpegKit 等自带的 32 位 .so 以压缩包体
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 个人分发：沿用 debug 签名，产出可直接安装的正式包
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // FFmpegKit 已从 Maven Central 下架（原 com.arthenica 坐标失效），改本地 AAR：
    // 阿里云/华为云镜像缓存 4.5.1 全 ABI（含 x86_64，可跑模拟器）；smart-exception-java 为其传递依赖，一并本地化
    implementation files('libs/ffmpeg-kit-full-4.5.1.aar', 'libs/smart-exception-java-0.1.1.jar', 'libs/smart-exception-common-0.1.1.jar')

    // P6 图片 OCR：ML Kit 中文识别（内置 bundled 模型，离线可用，含拉丁字符）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
